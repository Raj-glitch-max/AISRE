<!-- @dsCard group="Brand" viewport="700x170" name="Stepper geometry" subtitle="Six flush 3px segments; a failure collapses the rest into one red run" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-family:var(--font-mono)}</style></head><body>
<div style="display:grid;gap:22px">
<div><div style="display:flex;gap:4px"><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:1;height:3px;background:var(--signal-caution)"></div><div style="flex:1;height:3px;background:var(--signal-inert)"></div><div style="flex:1;height:3px;background:var(--signal-inert)"></div></div><div style="font-size:11px;color:var(--text-meta);letter-spacing:.01em;margin-top:8px">in progress · amber at the cursor</div></div>
<div><div style="display:flex;gap:4px"><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:1;height:3px;background:var(--signal-nominal)"></div><div style="flex:2;height:3px;background:var(--signal-warning)"></div></div><div style="font-size:11px;color:var(--text-meta);letter-spacing:.01em;margin-top:8px">failed · one red run replaces every remaining segment</div></div>
</div></body></html>
