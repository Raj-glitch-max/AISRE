<!-- @dsCard group="Colors" viewport="700x150" name="Signal colors" subtitle="Three lamps, one meaning each — nothing else may use them" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-family:var(--font-mono)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule-hairline)">
<div style="background:var(--surface-panel);padding:12px"><div style="height:34px;background:var(--signal-caution)"></div><div style="font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--text-meta);text-transform:uppercase;margin-top:10px;color:var(--signal-caution)">Caution</div><div style="font-size:11px;color:var(--text-meta);letter-spacing:.01em;margin-top:4px">#f9a800 · needs a decision</div></div>
<div style="background:var(--surface-panel);padding:12px"><div style="height:34px;background:var(--signal-nominal)"></div><div style="font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--text-meta);text-transform:uppercase;margin-top:10px;color:var(--signal-nominal)">Nominal</div><div style="font-size:11px;color:var(--text-meta);letter-spacing:.01em;margin-top:4px">#7fe059 · resolved</div></div>
<div style="background:var(--surface-panel);padding:12px"><div style="height:34px;background:var(--signal-warning)"></div><div style="font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--text-meta);text-transform:uppercase;margin-top:10px;color:var(--signal-warning)">Warning</div><div style="font-size:11px;color:var(--text-meta);letter-spacing:.01em;margin-top:4px">#f64258 · remediation failed</div></div>
</div></body></html>
