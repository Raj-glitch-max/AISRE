<!-- @dsCard group="Brand" viewport="700x150" name="Motion — the only three" subtitle="Awaiting breathes; executing and verifying pulse a dot; nothing else moves" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:28px;align-items:center;background:var(--surface-panel);padding:16px">
<span style="font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--signal-caution);animation:annunciator-pulse var(--pulse-duration) var(--pulse-easing) infinite">AWAITING</span>
<span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--signal-caution)"><span style="width:6px;height:6px;background:var(--signal-caution);animation:annunciator-pulse var(--pulse-duration) var(--pulse-easing) infinite"></span>EXECUTING</span>
<span style="font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--signal-nominal)">RESOLVED</span>
<span style="font-size:11px;color:var(--text-meta);letter-spacing:.01em">2.4s flat sine fade, 100% → 55%. No fades, slides, or hover lifts anywhere else.</span>
</div></body></html>
