<!-- @dsCard group="Type" viewport="700x160" name="Label caps — Departure Mono" subtitle="Short status words only, tracked +0.15em; never a sentence" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:20px;flex-wrap:wrap;font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em">
<span style="color:var(--signal-caution)">OPEN</span><span style="color:var(--signal-caution)">INVESTIGATING</span><span style="color:var(--signal-caution)">AWAITING</span><span style="color:var(--signal-nominal)">RESOLVED</span><span style="color:var(--signal-warning)">FAILED</span>
</div>
<div style="margin-top:16px;font-family:var(--font-pixel);font-size:12px;letter-spacing:.15em;color:var(--text-meta)">A SENTENCE SET IN THE PIXEL FACE STOPS BEING LEGIBLE</div>
<div style="font-size:11px;color:var(--text-meta);letter-spacing:.01em;margin-top:6px;color:var(--signal-warning)">Never — cap it at roughly ten characters</div>
</body></html>
